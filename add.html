<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Add to Tessera</title>
<style>
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #000; color: #fff; font: 16px system-ui, sans-serif; text-align: center; }
  main { max-width: 520px; padding: 24px; }
  code { background: #1c1c1c; padding: 2px 6px; border-radius: 6px; word-break: break-all; }
  a.button { display: inline-block; margin-top: 16px; padding: 10px 18px; border-radius: 10px; background: #fff; color: #000; font-weight: 600; text-decoration: none; }
  .error { color: #ff6b6b; }
</style>
</head>
<body>
<main>
  <h1>Add to Tessera</h1>
  <p id="message"></p>
  <a class="button" id="open" hidden>Open Tessera</a>
</main>
<script>
  const params = new URLSearchParams(location.search);
  const repo = (params.get('repo') || params.get('url') || '').trim();
  const valid = /^[A-Za-z0-9_.-]{1,100}\/[A-Za-z0-9_.-]{1,100}$/.test(repo) || /^https:\/\/[^\s]{1,490}$/.test(repo);
  const message = document.getElementById('message');
  if (valid) {
    const link = `tessera://marketplace/add?repo=${encodeURIComponent(repo)}`;
    message.innerHTML = 'Adding the marketplace <code></code> to Tessera…';
    message.querySelector('code').textContent = repo;
    const open = document.getElementById('open');
    open.href = link;
    open.hidden = false;
    location.href = link;
  } else {
    message.className = 'error';
    message.textContent = 'This link does not name a marketplace.';
  }
</script>
</body>
</html>
